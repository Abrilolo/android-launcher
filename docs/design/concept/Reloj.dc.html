<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reloj mundial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      MUNDO
    </a>
    <button aria-label="Agregar ciudad" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #333; background: transparent; color: #fff; font-size: 22px; cursor: pointer">+</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">CIUDAD DE MÉXICO · AQUÍ</div>
    <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 96px; line-height: 0.9; letter-spacing: -2px">06:28</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{cities}}" as="c" hint-placeholder-count="4">
      <div style="border: 1px solid #222; border-radius: 22px; background: #0b0b0b; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 17px">{{c.name}}</div>
            <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #9a9a9a">{{c.offset}} · {{c.day}}</div>
          </div>
          <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 34px">{{c.time}}</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px">
          <sc-for list="{{c.hours}}" as="h" hint-placeholder-count="24">
            <div style="height: 5px; border-radius: 3px; background: {{h.color}}"></div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #9a9a9a">BARRA = 24 H · BLANCO DÍA · ROJO AHORA</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const list = [
{ name: 'Tokio', offset: '+15 H', day: 'HOY', hour: 21, time: '21:28' },
{ name: 'Madrid', offset: '+8 H', day: 'HOY', hour: 14, time: '14:28' },
{ name: 'Londres', offset: '+7 H', day: 'HOY', hour: 13, time: '13:28' },
{ name: 'Nueva York', offset: '+2 H', day: 'HOY', hour: 8, time: '08:28' }
];
return {
cities: list.map((c) => {
const hours = [];
for (let h = 0; h < 24; h++) {
const day = h >= 7 && h < 20;
hours.push({ color: h === c.hour ? '#d71921' : (day ? '#cfcfcf' : '#262626') });
}
return { name: c.name, offset: c.offset, day: c.day, time: c.time, hours: hours };
})
};
}
}
</script>
</body>
</html>
