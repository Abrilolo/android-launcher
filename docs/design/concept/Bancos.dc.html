<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bancos protegido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      INICIO
    </a>
    <div style="display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #9a9a9a">
      <div style="width: 6px; height: 6px; border-radius: 3px; background: {{statusColor}}"></div>
      {{statusLabel}}
    </div>
  </div>
  <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -1px">BANCOS</div>

  <sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; opacity: 0.35">
        <div style="height: 64px; border-radius: 20px; background: #111"></div>
        <div style="height: 64px; border-radius: 20px; background: #111"></div>
        <div style="height: 64px; border-radius: 20px; background: #111"></div>
        <div style="height: 64px; border-radius: 20px; background: #111"></div>
      </div>
      <button onClick="{{unlock}}" aria-label="Desbloquear con huella" style="width: 132px; height: 132px; border-radius: 66px; border: 1px solid #d71921; background: #0b0b0b; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true"><path d="M12 11v3a8 8 0 0 1-1.5 4.5"></path><path d="M8.5 9.5a3.5 3.5 0 0 1 7 0V14a11 11 0 0 1-.7 3.8"></path><path d="M5.5 12V9.5a6.5 6.5 0 0 1 13 0V13"></path><path d="M6 16.5a10 10 0 0 0 .8-2.5"></path><path d="M18.3 16.5c-.2.8-.4 1.6-.8 2.4"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="font-size: 17px">Toca para desbloquear</div>
        <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #9a9a9a">HUELLA O PIN</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #222; padding-bottom: 14px">
        <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">SE BLOQUEA EN</div>
        <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 28px; color: #d71921">0:45</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{apps}}" as="app" hint-placeholder-count="8">
          <button style="height: 76px; box-sizing: border-box; border: 1px solid #222; border-radius: 22px; background: #0b0b0b; color: #fff; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
            <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">{{app.kind}}</span>
            <span style="font-size: 18px">{{app.name}}</span>
          </button>
        </sc-for>
      </div>
      <button onClick="{{lock}}" style="margin-top: auto; height: 52px; border-radius: 26px; border: 1px solid #333; background: transparent; color: #fff; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 3px; cursor: pointer">BLOQUEAR AHORA</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { locked: true };
}
renderVals() {
const locked = this.state.locked;
return {
locked: locked,
unlocked: !locked,
statusLabel: locked ? 'BLOQUEADO' : 'ABIERTO',
statusColor: locked ? '#d71921' : '#ffffff',
unlock: () => this.setState({ locked: false }),
lock: () => this.setState({ locked: true }),
apps: [
{ name: 'Nu', kind: 'BANCO' },
{ name: 'BBVA', kind: 'BANCO' },
{ name: 'Revolut', kind: 'BANCO' },
{ name: 'Mercado Pago', kind: 'PAGOS' },
{ name: 'Wallet', kind: 'TARJETAS' },
{ name: 'DolarApp', kind: 'DIVISAS' },
{ name: 'GBM', kind: 'INVERSIÓN' },
{ name: 'Bitso', kind: 'CRIPTO' }
]
};
}
}
</script>
</body>
</html>
