<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Módulos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 48px 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

  <sc-if value="{{listing}}" hint-placeholder-val="{{ true }}">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      INICIO
    </a>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 48px; line-height: 1">MÓDULOS</div>
      <div style="font-family: 'Space Mono', monospace; font-size: 11px; color: #9a9a9a; padding-bottom: 6px">{{onCount}} EN INICIO</div>
    </div>
    <div style="display: flex; flex-direction: column; border-top: 1px solid #222">
      <sc-for list="{{modules}}" as="m" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1a1a1a">
          <button onClick="{{m.edit}}" style="flex-grow: 1; min-width: 0; height: 64px; border: 0; background: transparent; color: #fff; padding: 0; display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; font-family: 'Space Grotesk', sans-serif">
            <span style="display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 18px; color: {{m.nameColor}}">{{m.name}}</span>
              <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; color: #9a9a9a">{{m.summary}}</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5a5a5a" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
          <button onClick="{{m.toggle}}" aria-label="{{m.toggleLabel}}" aria-pressed="{{m.on}}" style="width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; border: 1px solid {{m.trackBorder}}; background: {{m.track}}; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{m.justify}}; cursor: pointer">
            <span style="width: 22px; height: 22px; border-radius: 11px; background: {{m.knob}}"></span>
          </button>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #9a9a9a; line-height: 1.6">INTERRUPTOR = WIDGET EN INICIO<br>TOCA EL NOMBRE PARA EDITAR</div>
  </sc-if>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{back}}" style="align-self: flex-start; height: 44px; border: 0; background: transparent; color: #9a9a9a; padding: 0; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      MÓDULOS
    </button>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">EDITAR</div>
      <div style="font-size: 32px">{{cur.name}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">WIDGET EN INICIO</div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
          <button onClick="{{s.pick}}" style="flex: 1; height: 40px; border-radius: 20px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; cursor: pointer">{{s.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid #222">
      <sc-for list="{{cur.fields}}" as="f" hint-placeholder-count="4">
        <button style="min-height: 60px; border: 0; border-bottom: 1px solid #1a1a1a; background: transparent; color: #fff; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; cursor: pointer; font-family: 'Space Grotesk', sans-serif">
          <span style="font-size: 16px; color: #cfcfcf">{{f.label}}</span>
          <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #fff; text-align: right">{{f.value}}</span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 52px; border-radius: 26px; border: 1px solid #333; background: transparent; color: #fff; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; cursor: pointer">EXPORTAR DATOS · CSV</button>
      <button style="height: 44px; border: 0; background: transparent; color: #d71921; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; cursor: pointer">BORRAR HISTORIAL DEL MÓDULO</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { editing: -1, on: [true, true, true, true, true, true, true, true], size: ['M', 'M', 'M', 'M', 'M', 'M', 'M', 'L'] };
}
renderVals() {
const mods = [
{ name: 'Ejercicio', summary: 'GUÍA TOKIO · A / B / C', fields: [
{ label: 'Plan activo', value: 'Guía Tokio · Oct 2026' }, { label: 'Hora de inicio', value: '20:35' },
{ label: 'Descanso entre series', value: '60-120 S' }, { label: 'Días de peso', value: 'L · X · V' }, { label: 'Equipo', value: 'Mancuernas ≤ 10 KG' } ] },
{ name: 'Dieta', summary: '4 TIEMPOS · DESDE 13:00', fields: [
{ label: 'Comida completa', value: '13:00' }, { label: 'Proteína + energía', value: '16:30' },
{ label: 'Colación preentreno', value: '18:30' }, { label: 'Cena', value: '21:30' }, { label: 'Meta de agua', value: '8 VASOS' } ] },
{ name: 'Finanzas', summary: 'PRESUPUESTO DIARIO', fields: [
{ label: 'Presupuesto diario', value: '[TU MONTO]' }, { label: 'Moneda', value: 'MXN' },
{ label: 'Categorías', value: 'COMIDA · TRANSPORTE · CAFÉ · OTROS' }, { label: 'Corte semanal', value: 'LUNES' } ] },
{ name: 'Notas', summary: '3 ETIQUETAS', fields: [
{ label: 'Etiquetas', value: 'GENERAL · TRABAJO · IDEAS' }, { label: 'Nota fijada en inicio', value: 'LA MÁS RECIENTE' } ] },
{ name: 'Alarmas', summary: 'RELOJ DEL SISTEMA', fields: [
{ label: 'Origen', value: 'APP RELOJ' }, { label: 'Mostrar en inicio', value: 'SOLO LA SIGUIENTE' } ] },
{ name: 'Reloj mundial', summary: '4 CIUDADES', fields: [
{ label: 'Ciudades', value: 'TYO · MAD · LON · NYC' }, { label: 'En el widget', value: 'TYO · NYC' }, { label: 'Formato', value: '24 H' } ] },
{ name: 'Bancos', summary: 'HUELLA O PIN · 8 APPS', fields: [
{ label: 'Apps incluidas', value: '8' }, { label: 'Se vuelve a bloquear', value: 'A LOS 45 S' },
{ label: 'Desbloqueo', value: 'HUELLA O PIN' }, { label: 'Ocultar de búsqueda', value: 'SÍ' } ] },
{ name: 'Apps y espacios', summary: 'MAÑANA · TRABAJO · NOCHE', fields: [
{ label: 'Mañana', value: '06:00-12:00' }, { label: 'Trabajo', value: '12:00-18:00' },
{ label: 'Noche', value: '18:00-06:00' }, { label: 'Pausa para restringidas', value: '30 S' } ] }
];
const on = this.state.on;
const ed = this.state.editing;
const cur = ed >= 0 ? mods[ed] : { name: '', fields: [] };
return {
listing: ed < 0,
editing: ed >= 0,
onCount: on.filter(Boolean).length,
cur: cur,
back: () => this.setState({ editing: -1 }),
sizes: ['S', 'M', 'L'].map((label) => {
const sel = ed >= 0 && this.state.size[ed] === label;
return { label: label === 'S' ? 'CHICO' : (label === 'M' ? 'MEDIO' : 'ANCHO'), bg: sel ? '#ffffff' : 'transparent', fg: sel ? '#000000' : '#cfcfcf', border: sel ? '#ffffff' : '#333333',
pick: () => { const s = this.state.size.slice(); s[ed] = label; this.setState({ size: s }); } };
}),
modules: mods.map((m, i) => ({
name: m.name,
summary: m.summary,
on: on[i] ? 'true' : 'false',
nameColor: on[i] ? '#ffffff' : '#7a7a7a',
toggleLabel: (on[i] ? 'Quitar del inicio: ' : 'Mostrar en inicio: ') + m.name,
track: on[i] ? '#ffffff' : 'transparent',
trackBorder: on[i] ? '#ffffff' : '#444444',
knob: on[i] ? '#000000' : '#5a5a5a',
justify: on[i] ? 'flex-end' : 'flex-start',
toggle: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); },
edit: () => this.setState({ editing: i })
}))
};
}
}
</script>
</body>
</html>
