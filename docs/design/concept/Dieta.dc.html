<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dieta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    DIETA
  </a>
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">COMIDAS HOY</div>
      <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 72px; line-height: 1">{{done}}/4</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-bottom: 8px">
      <sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
        <div style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; background: {{m.fill}}; border: 1.5px solid {{m.ring}}"></div>
      </sc-for>
    </div>
  </div>
  <div style="font-size: 14px; color: #cfcfcf">{{nextLine}}</div>

  <div style="display: flex; flex-direction: column; border-top: 1px solid #222">
    <sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
      <button onClick="{{m.toggle}}" style="display: flex; align-items: center; gap: 16px; padding: 18px 0; border: 0; border-bottom: 1px solid #1a1a1a; background: transparent; color: #fff; text-align: left; cursor: pointer; font-family: 'Space Grotesk', sans-serif">
        <span style="width: 48px; font-family: 'Space Mono', monospace; font-size: 12px; color: #9a9a9a">{{m.time}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 18px; color: {{m.titleColor}}">{{m.name}}</span>
          <span style="font-size: 13px; color: #9a9a9a">{{m.detail}}</span>
        </span>
        <span style="width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; background: {{m.fill}}; border: 1.5px solid {{m.ring}}"></span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; border: 1px solid #222; border-radius: 26px; background: #0b0b0b; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">AGUA</div>
      <div style="display: flex; gap: 6px">
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #fff"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #fff"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #fff"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #2a2a2a"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #2a2a2a"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #2a2a2a"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #2a2a2a"></div>
        <div style="width: 10px; height: 18px; border-radius: 3px; background: #2a2a2a"></div>
      </div>
    </div>
    <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 28px">3/8</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: [false, false, false, false] };
}
renderVals() {
const base = [
{ name: 'Comida completa', time: '13:00', detail: 'Pollo, carne o pescado + arroz + verduras' },
{ name: 'Proteína + energía', time: '16:30', detail: 'Yogur alto en proteína + granola + fruta' },
{ name: 'Colación preentreno', time: '18:30', detail: 'Onigiri + leche, o plátano + yogur' },
{ name: 'Cena post entreno', time: '21:30', detail: 'Arroz + proteína + verduras' }
];
const done = this.state.done;
const nextIndex = done.indexOf(false);
const meals = base.map((m, i) => ({
name: m.name,
time: m.time,
detail: m.detail,
fill: done[i] ? '#ffffff' : 'transparent',
ring: done[i] ? '#ffffff' : (i === nextIndex ? '#d71921' : '#555555'),
titleColor: done[i] ? '#ffffff' : '#cfcfcf',
toggle: () => {
const next = done.slice();
next[i] = !next[i];
this.setState({ done: next });
}
}));
return {
meals: meals,
done: done.filter(Boolean).length,
nextLine: nextIndex < 0 ? 'Día completo.' : 'Sigue: ' + base[nextIndex].name.toLowerCase() + ' a las ' + base[nextIndex].time
};
}
}
</script>
</body>
</html>
