<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio de hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 48px 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      EJERCICIO
    </a>
    <a href="EjercicioSemana.dc.html" style="height: 44px; display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #cfcfcf">
      SEMANA
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">HOY · MIÉRCOLES · SESIÓN</div>
      <div style="font-size: 22px; line-height: 1.15">Piernas, hombros<br>y brazos</div>
      <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #cfcfcf">20:35 · 45-50 MIN · CENA 21:30</div>
    </div>
    <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 120px; line-height: 0.8">B</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">
      <span>SERIES</span>
      <span>{{doneSets}} / {{totalSets}}</span>
    </div>
    <div style="display: flex; gap: 3px">
      <sc-for list="{{progress}}" as="p" hint-placeholder-count="15">
        <div style="flex: 1; height: 6px; border-radius: 3px; background: {{p.color}}"></div>
      </sc-for>
    </div>
  </div>

  <button onClick="{{toggleWarm}}" style="border: 1px solid #222; border-radius: 22px; background: #0b0b0b; color: #fff; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer; font-family: 'Space Grotesk', sans-serif">
    <span style="display: flex; justify-content: space-between; width: 100%; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">
      <span>CALENTAMIENTO · 5-7 MIN</span>
      <span style="color: {{warmColor}}">{{warmState}}</span>
    </span>
    <span style="font-size: 14px; color: #cfcfcf; line-height: 1.5">3 min bici o caminadora · 8 sentadillas sin peso · 8 bisagras de cadera · tobillos y hombros</span>
  </button>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{exercises}}" as="e" hint-placeholder-count="7">
      <div style="border: 1px solid {{e.border}}; border-radius: 22px; background: #0b0b0b; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <button onClick="{{e.open}}" aria-label="{{e.openLabel}}" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #fff; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; font-family: 'Space Grotesk', sans-serif">
            <span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #9a9a9a">{{e.n}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 17px; color: {{e.nameColor}}">{{e.name}}</span>
              <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; color: #9a9a9a">{{e.scheme}}</span>
            </span>
          </button>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{e.sets}}" as="s" hint-placeholder-count="3">
              <button onClick="{{s.tap}}" aria-label="{{s.label}}" style="width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; border: 1.5px solid {{s.ring}}; background: {{s.fill}}; padding: 0; cursor: pointer"></button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{e.isOpen}}" hint-placeholder-val="{{ false }}">
          <div style="border-top: 1px solid #1f1f1f; padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 14px; color: #cfcfcf; line-height: 1.4">{{e.how}}</div>
            <div style="display: flex; gap: 8px; align-items: baseline">
              <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #d71921">CUIDA</span>
              <span style="font-size: 13px; color: #cfcfcf; line-height: 1.4">{{e.care}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
              <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #9a9a9a">ÚLTIMA VEZ · {{e.last}}</span>
              <span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 22px">{{e.load}}</span>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; border-radius: 26px; background: #fff; color: #000; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px">DESCANSO</div>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{rests}}" as="r" hint-placeholder-count="3">
          <button onClick="{{r.pick}}" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #000; background: {{r.bg}}; color: {{r.fg}}; font-family: 'Space Mono', monospace; font-size: 11px; cursor: pointer">{{r.label}}</button>
        </sc-for>
      </div>
    </div>
    <button onClick="{{startRest}}" aria-label="Iniciar descanso" style="border: 0; background: transparent; color: #000; padding: 0; cursor: pointer; font-family: 'Doto', monospace; font-weight: 800; font-size: 46px">{{clock}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: [3, 2, 0, 0, 0, 0, 0], open: 2, warm: true, rest: 90, left: 90, running: false };
}
componentDidMount() {
this.timer = setInterval(() => {
if (!this.state.running) return;
const left = this.state.left - 1;
this.setState(left <= 0 ? { left: this.state.rest, running: false } : { left: left });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const plan = [
{ name: 'Peso muerto rumano', sets: 3, scheme: '3 × 10-15', last: '10 KG × 13', load: '10 KG', how: 'Rodillas un poco flexionadas. Lleva la cadera atrás y desliza las mancuernas cerca de las piernas. Vuelve apretando glúteos.', care: 'No redondees la espalda ni lo conviertas en sentadilla.' },
{ name: 'Zancada hacia atrás', sets: 2, scheme: '2 × 8-12 POR LADO', last: '6 KG × 10', load: '6 KG', how: 'Desde de pie, da un paso atrás, baja y vuelve.', care: 'Rodilla delantera alineada con el pie; no pierdas el equilibrio.' },
{ name: 'Press de hombros', sets: 2, scheme: '2 × 8-15', last: '8 KG × 11', load: '8 KG', how: 'Abdomen firme. Empuja las mancuernas por encima de la cabeza y baja con control.', care: 'Evita arquear la espalda para levantar más peso.' },
{ name: 'Elevaciones laterales', sets: 2, scheme: '2 × 12-20', last: '4 KG × 15', load: '4 KG', how: 'Codos un poco flexionados; eleva los brazos a los lados hasta la altura del hombro.', care: 'No encojas los hombros ni lances las mancuernas.' },
{ name: 'Curl martillo', sets: 2, scheme: '2 × 10-15', last: '8 KG × 12', load: '8 KG', how: 'Palmas mirándose todo el movimiento. Flexiona sin balancear y baja despacio.', care: 'No dobles las muñecas ni adelantes los codos.' },
{ name: 'Extensión de tríceps', sets: 2, scheme: '2 × 10-15', last: '6 KG × 12', load: '6 KG', how: 'Una mancuerna con ambas manos. Baja detrás de la cabeza y extiende los codos.', care: 'Abdomen firme; no fuerces los hombros ni arquees la espalda.' },
{ name: 'Plancha lateral', sets: 2, scheme: '2 × 20-40 S · ABDOMEN', last: '30 S', load: '30 S', how: 'De lado, codo bajo el hombro. Eleva la cadera en línea con hombro y pies.', care: 'No hundas el hombro ni gires el tronco. Más fácil: rodillas apoyadas.' }
];
const done = this.state.done;
const current = done.findIndex((d, i) => d < plan[i].sets);
const totalSets = plan.reduce((s, p) => s + p.sets, 0);
const doneSets = done.reduce((s, d) => s + d, 0);
const progress = [];
for (let i = 0; i < totalSets; i++) progress.push({ color: i < doneSets ? '#ffffff' : (i === doneSets ? '#d71921' : '#2a2a2a') });
const exercises = plan.map((p, i) => {
const sets = [];
for (let k = 0; k < p.sets; k++) {
const filled = k < done[i];
const next = i === current && k === done[i];
sets.push({
fill: filled ? '#ffffff' : 'transparent',
ring: filled ? '#ffffff' : (next ? '#d71921' : '#444444'),
label: 'Serie ' + (k + 1) + ' de ' + p.name,
tap: () => {
const n = done.slice();
n[i] = filled && k === done[i] - 1 ? k : k + 1;
this.setState({ done: n, left: this.state.rest, running: n[i] > done[i] });
}
});
}
const finished = done[i] >= p.sets;
return {
n: String(i + 1).padStart(2, '0'),
name: p.name,
scheme: p.scheme,
how: p.how,
care: p.care,
last: p.last,
load: p.load,
sets: sets,
isOpen: this.state.open === i,
openLabel: (this.state.open === i ? 'Ocultar técnica de ' : 'Ver técnica de ') + p.name,
nameColor: finished ? '#7a7a7a' : '#ffffff',
border: i === current ? '#3a3a3a' : '#222222',
open: () => this.setState({ open: this.state.open === i ? -1 : i })
};
});
const left = this.state.left;
return {
exercises: exercises,
progress: progress,
doneSets: doneSets,
totalSets: totalSets,
warmState: this.state.warm ? 'HECHO' : 'PENDIENTE',
warmColor: this.state.warm ? '#ffffff' : '#d71921',
toggleWarm: () => this.setState({ warm: !this.state.warm }),
clock: Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'),
startRest: () => this.setState({ running: !this.state.running }),
rests: [60, 90, 120].map((s) => {
const on = s === this.state.rest;
return { label: s + 'S', bg: on ? '#000000' : 'transparent', fg: on ? '#ffffff' : '#000000', pick: () => this.setState({ rest: s, left: s, running: false }) };
})
};
}
}
</script>
</body>
</html>
