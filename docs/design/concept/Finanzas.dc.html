<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Finanzas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#777}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <a href="Main.dc.html" aria-label="Volver al inicio" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #9a9a9a">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    FINANZAS
  </a>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">GASTO HOY</div>
    <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 72px; line-height: 1">{{total}}</div>
    <div style="font-size: 13px; color: #cfcfcf">{{count}} registros · semana $1,480</div>
  </div>

  <div style="border: 1px solid #222; border-radius: 26px; background: #0b0b0b; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">ÚLTIMOS 7 DÍAS</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{week}}" as="day" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <sc-for list="{{day.dots}}" as="dot" hint-placeholder-count="8">
            <div style="width: 9px; height: 9px; border-radius: 5px; background: {{dot.color}}"></div>
          </sc-for>
          <div style="margin-top: 6px; font-family: 'Space Mono', monospace; font-size: 10px; color: {{day.labelColor}}">{{day.label}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1a1a1a">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px">{{item.what}}</div>
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; color: #9a9a9a">{{item.time}}</div>
        </div>
        <div style="font-family: 'Doto', monospace; font-weight: 800; font-size: 22px">{{item.amount}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; gap: 8px">
    <label style="flex: 0 0 104px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">MONTO</span>
      <input value="{{amount}}" onChange="{{setAmount}}" inputmode="decimal" placeholder="0.00" style="height: 48px; box-sizing: border-box; border: 1px solid #333; border-radius: 16px; background: #0b0b0b; color: #fff; padding: 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 16px"></input>
    </label>
    <label style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #9a9a9a">CONCEPTO</span>
      <input value="{{concept}}" onChange="{{setConcept}}" placeholder="Café, uber…" style="height: 48px; box-sizing: border-box; border: 1px solid #333; border-radius: 16px; background: #0b0b0b; color: #fff; padding: 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 16px"></input>
    </label>
    <button onClick="{{add}}" aria-label="Registrar gasto" style="align-self: flex-end; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 24px; border: 0; background: #fff; color: #000; font-size: 24px; cursor: pointer">+</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
amount: '',
concept: '',
items: [
{ what: 'Café', time: '08:10', cents: 6500 },
{ what: 'Uber', time: '09:02', cents: 11000 },
{ what: 'Comida', time: '13:40', cents: 7000 }
]
};
}
money(cents) {
return '$' + Math.round(cents / 100).toLocaleString('es-MX');
}
renderVals() {
const items = this.state.items;
const totalCents = items.reduce((sum, it) => sum + it.cents, 0);
const days = [
{ label: 'J', v: 3 }, { label: 'V', v: 6 }, { label: 'S', v: 8 }, { label: 'D', v: 2 },
{ label: 'L', v: 4 }, { label: 'M', v: 5 }, { label: 'M', v: Math.min(8, Math.max(1, Math.round(totalCents / 6000))) }
];
const week = days.map((d, i) => {
const today = i === days.length - 1;
const dots = [];
for (let k = 8; k >= 1; k--) {
dots.push({ color: k <= d.v ? (today ? '#ffffff' : '#5a5a5a') : '#161616' });
}
return { label: d.label, labelColor: today ? '#ffffff' : '#9a9a9a', dots: dots };
});
return {
total: this.money(totalCents),
count: items.length,
week: week,
items: items.slice().reverse().map((it) => ({ what: it.what, time: it.time, amount: this.money(it.cents) })),
amount: this.state.amount,
concept: this.state.concept,
setAmount: (e) => this.setState({ amount: e.target.value }),
setConcept: (e) => this.setState({ concept: e.target.value }),
add: () => {
const cents = Math.round(parseFloat(String(this.state.amount).replace(',', '.')) * 100);
if (!cents || cents <= 0 || !this.state.concept.trim()) return;
const now = new Date();
const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
this.setState({ items: items.concat([{ what: this.state.concept.trim(), time: time, cents: cents }]), amount: '', concept: '' });
}
};
}
}
</script>
</body>
</html>
